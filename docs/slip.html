<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Slip</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e4e2dc;--acc:#1f5f4a;--win:#2e7d4f;--draw:#b8860b;--loss:#b3402f;--chip:#eeece6}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--mute:#9b9a94;--line:#2f2f2c;--acc:#6cc3a0;--win:#5cbf86;--draw:#e0b341;--loss:#e07a68;--chip:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 0;max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--mute);font-size:13px}.sub a{color:var(--acc)}
nav{display:flex;gap:4px;overflow-x:auto;padding:14px 16px 0;max-width:1000px;margin:0 auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:8px 12px;font:inherit;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{color:var(--mute);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
.pk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.pk:first-of-type{border-top:0}
.pk .what{font-weight:700;font-size:16px}.pk .odds{font-weight:700;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.pk .m,.pk .why{color:var(--mute);font-size:13px}.pk .why{grid-column:1/-1}
.b{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--chip);white-space:nowrap;display:inline-block}
.b.ok{background:var(--win);color:#fff}.b.no{background:var(--loss);color:#fff}.b.push{background:var(--draw);color:#fff}
.up{color:var(--win)}.down{color:var(--loss)}
.mot{font-size:12px;color:var(--draw);margin-top:2px}.b.fam{background:var(--chip);color:var(--mute)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:30px}
.note{font-size:13px;color:var(--mute)}
.hide{display:none}
@media (max-width:560px){.hide-s{display:none}}
</style>
</head>
<body>
<header>
  <h1>Daily slip</h1>
  <div class="sub" id="meta">Loading…</div>
  <div class="sub"><a href="./">← Magic Numbers site</a></div>
</header>
<nav id="tabs">
  <button data-t="slip" class="on">Today</button>
  <button data-t="value">Value board</button>
  <button data-t="movers">Price movers</button>
  <button data-t="past">Past picks</button>
  <button data-t="model">Model check</button>
  <button data-t="live">Live patterns</button>
  <button data-t="how">How it works</button>
</nav>
<main>
  <section id="slip"></section>
  <section id="value" class="hide">
    <div class="toolbar"><input type="search" id="q" placeholder="Team or league"><select id="mk"><option value="">All three markets</option><option value="win">Win (home or away)</option><option value="over25">Over 2.5 goals</option><option value="ht15">Over 1.5 goals, 1st half</option></select><select id="fam"><option value="">All leagues</option><option value="less">Lesser-known only</option></select><select id="ref"><option value="">Any reference</option><option value="pin">Pinnacle only</option></select></div>
    <div class="card tw"><table id="vt"></table></div>
  </section>
  <section id="movers" class="hide"><div class="card tw"><p class="note">Selections whose margin-free chance has risen by 3+ points since we first saw the match — money coming in. Price shown: first best price → best price now.</p><table id="mt"></table></div></section>
  <section id="past" class="hide"></section>
  <section id="model" class="hide"></section>
  <section id="live" class="hide"></section>
  <section id="how" class="hide"><div class="card" id="howc"></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x, d = 1) => x == null ? '–' : (x * 100).toFixed(d) + '%';
const pts = x => x == null ? '–' : `<span class="${x > 0 ? 'up' : x < 0 ? 'down' : ''}">${x > 0 ? '+' : ''}${(x * 100).toFixed(1)}</span>`;
const sgn = x => x == null ? '–' : `<span class="${x > 0 ? 'up' : x < 0 ? 'down' : ''}">${x > 0 ? '+' : ''}${(x * 100).toFixed(1)}%</span>`;
const eur = x => x == null ? '–' : `<span class="${x > 0 ? 'up' : x < 0 ? 'down' : ''}">${x < 0 ? '−' : ''}€${Math.abs(x).toFixed(2)}</span>`;
const when = ts => new Date(ts * 1000).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const refName = r => r === 'pin' ? 'Pinnacle' : 'consensus';
const res = p => p.r == null ? (p.ts * 1000 < Date.now() ? '<span class="b">waiting</span>' : '') :
  `<span class="b ${p.r > 0 ? 'ok' : p.r < 0 ? 'no' : 'push'}">${p.r === 1 ? 'won' : p.r === 0.5 ? 'half won' : p.r === 0 ? 'push' : p.r === -0.5 ? 'half lost' : 'lost'} ${esc(p.score)}</span>`;

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hide', s.id !== b.dataset.t));
});

// Line-up checks from the live logger (live.json), by pick id.
const liveP = fetch('data/sm/live.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
let LU = {};
const luTag = p => {
  const l = LU[p.id];
  if (!l) return '';
  if (l.status === 'ok') return '<div class="mot">✅ Line-ups OK</div>';
  if (l.status === 'warn') return `<div class="mot">⚠️ Line-ups: ${esc(l.text)}</div>`;
  return '<div class="mot">Line-ups not published in time</div>';
};
function pickCard(p) {
  return `<div class="pk"><div><div class="what">${esc(p.pick)}</div><div class="m">${esc(p.hn)} – ${esc(p.an)} · ${esc(p.lg)} · ${when(p.ts)}</div></div>
  <div class="odds">${p.odds.toFixed(2)}<div class="m">${esc(p.book)}</div>${p.minOdds ? `<div class="m">take at ${p.minOdds.toFixed(2)}+ · bet365 ${p.b365 ? p.b365.toFixed(2) + (p.b365 >= p.minOdds ? ' ✓' : ' ✗') : '–'}</div>` : ''}</div>
  <div class="why">Chance ${pct(p.fair0)} (${refName(p.ref)})${p.boost ? ` + ${(p.boost * 100).toFixed(0)} pts motivation` : ''} · edge ${sgn(p.edge0)} · moved ${pts(p.move0)} pts since first seen · model ${pct(p.model)} · ${p.n} bookmakers
  ${p.clv != null ? ` · <b>later price: ${sgn(p.clv)}</b>` : ''} ${res(p)} ${p.profit != null ? eur(p.profit) : ''}
  ${p.motText ? `<div class="mot">Table: ${esc(p.motText)}</div>` : ''}${(p.why || []).map(w => `<div class="mot">${esc(w)}</div>`).join('')}
  ${p.warn ? `<div class="mot">⚠️ Injured/suspended: ${esc(p.warn)}</div>` : ''}${luTag(p)}</div></div>`;
}
// Paper results split by the warnings, to see whether they mean anything.
function warnSplit(all) {
  const s = all.filter(p => p.r != null), sum = a => a.reduce((t, p) => t + (p.profit || 0), 0);
  const g = [['line-ups OK', p => (LU[p.id] || {}).status === 'ok'], ['line-up warning', p => (LU[p.id] || {}).status === 'warn'],
    ['injury warning at pick time', p => p.warn], ['no injury warning', p => p.squad && !p.warn]];
  return g.map(([n, f]) => { const x = s.filter(f); return `${n}: ${x.length} settled, ${x.filter(p => p.r > 0).length} won, ${eur(x.length ? sum(x) : null)}`; }).join(' · ');
}

fetch('data/sm/slip.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null).then(async d => {
  const L0 = await liveP;
  for (const l of (L0 && L0.lineups) || []) LU[l.pid] = l;
  if (!d) {
    $('#meta').textContent = 'Not started yet.';
    $('#slip').innerHTML = '<div class="card empty">The daily slip starts when the Sportmonks trial is switched on (planned for 19 Nov 2026). The first slip appears after the first run that day.</div>';
    howText(null); return;
  }
  const s = d.status;
  $('#meta').innerHTML = `Updated ${new Date(d.at).toLocaleString()} · ${s.leagues} leagues · ${s.fixturesTracked} upcoming matches priced (${s.withPinnacle} with Pinnacle) · ${s.books} bookmakers${s.seasonsLeft ? ` · past seasons still downloading (${s.seasons - s.seasonsLeft}/${s.seasons})` : ''}`;
  const P = d.perf;
  const kpis = `<div class="grid">
    <div class="card kpi"><div class="v">${P.settled}/${P.logged}</div><div class="l">picks settled / logged</div></div>
    <div class="card kpi"><div class="v">${P.settled ? pct(P.won / P.settled, 0) : '–'}</div><div class="l">won</div></div>
    <div class="card kpi"><div class="v">${eur(P.profit)}</div><div class="l">paper profit (€10 a pick) · return ${sgn(P.roi)}</div></div>
    <div class="card kpi"><div class="v">${P.clvPos == null ? '–' : pct(P.clvPos, 0)}</div><div class="l">beat the later price (${P.clvN} picks, avg ${sgn(P.clvAvg)})</div></div></div>`;
  const G = (d.settings && d.settings.groupNames) || { win: 'Win', over25: 'Over 2.5 goals', ht15: 'Over 1.5 goals, 1st half' };
  const caps = (d.settings && d.settings.caps) || {};
  $('#slip').innerHTML = `<div class="card"><h2>Slip for ${esc(d.today)}</h2>${Object.keys(G).map(g => {
      const ps = d.slip.filter(p => p.grp === g);
      return `<div class="lg note" style="margin-top:10px"><b>${esc(G[g])}</b> · up to ${caps[g] ?? '–'} a day</div>` + (ps.length ? ps.map(pickCard).join('') : '<div class="note" style="padding:6px 0">Nothing passes the rules yet today.</div>');
    }).join('')}
    <p class="note">Singles, not an accumulator. Filled at each run (07:07, 13:07, 18:07, 23:07). Each pick is logged the first time it appears and never changed. On quiet days some sections stay empty — that is the point.</p></div>${kpis}`;

  const vrow = x => `<tr><td>${when(x.ts)}<br><small>${esc(x.lg)}</small></td><td>${esc(x.hn)} – ${esc(x.an)}<br><b>${esc(x.pick)}</b>
    ${x.famous ? ' <span class="b fam">famous league</span>' : ''}${x.motText ? `<div class="mot">${esc(x.motText)}${x.block ? ' · blocked by a motivation rule' : x.boost ? ` · +${(x.boost * 100).toFixed(0)} pts motivation` : ''}</div>` : ''}</td>
    <td class="n">${x.odds.toFixed(2)}<br><small>${esc(x.book)}</small></td><td class="n">${pct(x.fair)}<br><small>${refName(x.ref)}</small></td>
    <td class="n">${sgn(x.edge)}</td><td class="n hide-s">${pts(x.move)}</td><td class="n hide-s">${pct(x.model)}</td><td class="n hide-s">${x.n}</td></tr>`;
  const head = `<tr><th>Kick-off</th><th>Match / pick</th><th class="n">Best price</th><th class="n">Chance</th><th class="n">Edge</th><th class="n hide-s">Move</th><th class="n hide-s">Model</th><th class="n hide-s">Books</th></tr>`;
  const drawV = () => {
    const q = $('#q').value.toLowerCase(), mk = $('#mk').value, rf = $('#ref').value, fam = $('#fam').value;
    const rows = d.value.filter(x => (!mk || x.grp === mk) && (!rf || x.ref === rf) && (!fam || !x.famous) && (!q || `${x.hn} ${x.an} ${x.lg}`.toLowerCase().includes(q)));
    $('#vt').innerHTML = head + (rows.map(vrow).join('') || '<tr><td colspan="8" class="empty">Nothing priced above its fair chance right now.</td></tr>');
  };
  ['#q', '#mk', '#ref', '#fam'].forEach(id => $(id).oninput = drawV); drawV();
  $('#mt').innerHTML = `<tr><th>Kick-off</th><th>Match / selection</th><th class="n">Chance now</th><th class="n">Moved</th><th class="n">Price</th></tr>` +
    (d.movers.map(x => `<tr><td>${when(x.ts)}<br><small>${esc(x.lg)}</small></td><td>${esc(x.hn)} – ${esc(x.an)}<br><b>${esc(x.pick)}</b></td>
      <td class="n">${pct(x.fair)}<br><small>${refName(x.ref)}</small></td><td class="n">${pts(x.move)} pts</td><td class="n">${x.open.toFixed(2)} → ${x.odds.toFixed(2)}</td></tr>`).join('')
      || '<tr><td colspan="5" class="empty">No big moves yet — they show up as the week goes on.</td></tr>');

  const byDay = {};
  for (const p of d.history) (byDay[p.day] = byDay[p.day] || []).push(p);
  const mk = Object.entries(P.byMarket).map(([m, v]) => `${esc(m)}: ${v.n} settled, ${v.won ?? '–'} won, ${eur(v.profit)}`).join(' · ');
  const br = Object.entries(P.byRule || {}).map(([m, v]) => `${esc(m)}: ${v.n} settled, ${eur(v.profit)}, beat later price ${v.clvPos == null ? '–' : pct(v.clvPos, 0)} of ${v.clvN}`).join(' · ');
  $('#past').innerHTML = `<div class="card note">By market — ${mk}<br>Motivation — ${br}<br>Warnings — ${warnSplit([...d.slip, ...d.history])}</div>` + (Object.entries(byDay).map(([day, ps]) => `<div class="card"><h2>${esc(day)}</h2>${ps.map(pickCard).join('')}</div>`).join('')
    || '<div class="card empty">No earlier slips yet.</div>');

  const M = d.modelCheck;
  $('#model').innerHTML = `<div class="card"><h2>Does the goals model know anything?</h2>
    <p class="note">Log loss on 1X2 for settled matches, using each side's chances from before kick-off (lower is better). The model is only shown as a second opinion and is not used to choose picks unless it gets close to the market.</p>
    <table><tr><th>Compared on</th><th class="n">Matches</th><th class="n">Model</th><th class="n">Market</th></tr>
    <tr><td>All bookmakers' consensus</td><td class="n">${M.n}</td><td class="n">${M.model ?? '–'}</td><td class="n">${M.consensus ?? '–'}</td></tr>
    <tr><td>Pinnacle</td><td class="n">${M.nPin}</td><td class="n">${M.modelVsPin ?? '–'}</td><td class="n">${M.pinnacle ?? '–'}</td></tr></table></div>
    <div class="card tw"><h2>Recent runs</h2><table><tr><th>Time (UTC)</th><th>Job</th><th>Details</th></tr>${s.runs.map(r => {
      const { t, job, limits, calls, ...rest } = r; return `<tr><td>${esc(t.slice(5, 16).replace('T', ' '))}</td><td>${esc(job)}</td><td><small>${esc(JSON.stringify(rest))}</small></td></tr>`; }).join('')}</table></div>`;
  howText(d.settings);
});

function pressText(r) {
  let st = {}; try { st = JSON.parse(r.stats || '{}'); } catch { /* old row */ }
  const p = st.p10, bits = [];
  if (st.held) bits.push(`held back: ${st.held}`);
  if (st.leader && st.leader !== 'no clear favourite') bits.push(`${st.leader} leading`);
  if (st.miss) bits.push(`missing: ${st.miss.join(', ')}`);
  if (p) bits.push('last 10 min ' + ['corners', 'shots', 'dangerous'].filter(k => p[k]).map(k => `${k === 'dangerous' ? 'dangerous attacks' : k} ${p[k].home ?? 0}-${p[k].away ?? 0}`).join(', '));
  return bits.length ? `<br><small>${esc(bits.join(' · '))}</small>` : '';
}
liveP.then(L => {
  const intro = `<div class="card"><h2>Live patterns (test)</h2><p class="note">Situations from live betting, checked about every 20 seconds with the live price at that moment, then graded. Paper only. Alerts (sent to Telegram): <b>2-0 at 30'</b> with the two goals 5+ minutes apart → goal before half-time? <b>Two-goal lead at 70–78'</b> with the last two goals 5+ minutes apart → another goal? <b>The outsider scores first at 7–12', the favourite equalises by 30'</b> → another goal before half-time (over 2.5 1st half)? <b>Half-time 1-0 or 0-1 between scoring teams</b> (before kick-off the market gave over 2.5 a 58%+ chance), with 10+ shots or 5+ corners in the 1st half and the live over 2.5 at 1.80–2.00 → over 2.5 (history: 55%; outsider leading 59%, favourite leading 54%)? Lines marked "logged only" are the situations the rules leave out (goals close together, later equalisers, wider windows), kept for comparison. History (2,759 matches with goal minutes): 2-0 at 30' 40%, two-goal lead at 75' 49%, favourite equalises by 30' 77% (10/13), after 30' 25% (small samples). A price is worth taking only if the hit rate beats 1 ÷ price (e.g. 45% at 2.20). An alert is held back (logged, not sent) after a red card or when the best live price is below 1.80; those are counted on their own line. Corners, shots and dangerous attacks in the last 10 minutes are stored for every situation, to test whether pressure makes the late goal more likely.</p></div>`;
  if (!L) { $('#live').innerHTML = intro + '<div class="card empty">Starts with the Sportmonks trial and the live logger (planned for 19 Nov 2026).</div>'; return; }
  const sumRows = Object.entries(L.summary || {}).map(([k, v]) => {
    const priced = L.rows.filter(r => (r.key || r.pattern) === k && (r.hit === 0 || r.hit === 1) && r.best);
    const avg = priced.length ? priced.reduce((s, r) => s + r.best, 0) / priced.length : null;
    return `<tr><td>${esc((L.patterns[k] || {}).name || k)}</td><td class="n">${v.n}</td><td class="n">${v.settled ? pct(v.hit / v.settled) : '–'} <small>(${v.hit}/${v.settled})</small></td><td class="n">${avg ? avg.toFixed(2) : '–'}</td><td class="n">${avg ? pct(1 / avg, 0) : '–'}</td><td class="n">${eur(v.withPrice ? v.profit : null)}</td></tr>`;
  }).join('');
  const rows = (L.rows || []).slice(0, 200).map(r => `<tr><td>${when(r.at)}<br><small>${esc(r.league)}</small></td><td>${esc(r.home)} ${esc(r.score)} ${esc(r.away)} · ${r.minute}'<br><small>${esc((L.patterns[r.key || r.pattern] || {}).name || r.pattern)}</small>${pressText(r)}</td>
    <td class="n">${r.best ? Number(r.best).toFixed(2) : '–'}<br><small>${esc(r.best_book || '')}</small></td><td>${r.hit === 1 ? '<span class="b ok">yes</span>' : r.hit === 0 ? '<span class="b no">no</span>' : r.hit === -1 ? '<span class="b">void</span>' : '<span class="b">open</span>'} <small>${esc(r.result || '')}</small></td></tr>`).join('');
  $('#live').innerHTML = intro + `<div class="card tw"><table><tr><th>Pattern</th><th class="n">Logged</th><th class="n">Next goal came</th><th class="n">Avg price</th><th class="n">Break-even</th><th class="n">Paper €10</th></tr>${sumRows || '<tr><td colspan="6" class="empty">Nothing logged yet.</td></tr>'}</table></div>
    <div class="card tw"><table><tr><th>When</th><th>Match</th><th class="n">Live price</th><th>Goal?</th></tr>${rows || '<tr><td colspan="4" class="empty">Nothing logged yet.</td></tr>'}</table></div>`;
});

function howText(c) {
  c = c || { caps: { win: 4, over25: 4, ht15: 4 }, windowH: 36, odds: { win: [1.7, 3.5], over25: [1.8, 2.4], ht15: [2, 4] }, minEdgePin: 0.02, minEdgeCons: 0.04, minBooks: 4, maxAgainst: 0.03 };
  $('#howc').innerHTML = `<h2>How it works</h2>
  <p><b>Three markets:</b> a home or away win (never the draw), over 2.5 goals, and over 1.5 goals in the first half. The focus is the lesser-known leagues, where fewer people look and bookmakers put less work into their prices; the famous leagues are still recorded as a yardstick but kept off the slip.</p>
  <p>Four times a day the site records every bookmaker's prices for every upcoming match (next 7 days) in all leagues of the Sportmonks plan, so we can see how prices move through the week.</p>
  <p><b>Chance.</b> Each bookmaker's margin is removed (power method). Pinnacle's margin-free chance is the reference when Pinnacle prices the match; otherwise the median of all bookmakers. In our 2022–24 tests, Pinnacle's price was the best predictor we had, and beating it was the only rule that made money.</p>
  <p><b>Edge</b> = best price × chance − 1 (exchanges left out; a price more than 15% above the median is treated as an error). <b>Move</b> = how far the chance has changed since we first saw the match, in percentage points: money coming in (+) or going out (−).</p>
  <p><b>The slip</b>: per day up to ${c.caps ? `${c.caps.win} win, ${c.caps.over25} over-2.5 and ${c.caps.ht15} first-half picks` : 'a handful of picks'}, one per match, kick-off within ${c.windowH} h, odds ${c.odds ? `${c.odds.win[0].toFixed(2)}–${c.odds.win[1].toFixed(2)} for wins, ${c.odds.over25[0].toFixed(2)}–${c.odds.over25[1].toFixed(2)} for over 2.5 and ${c.odds.ht15[0].toFixed(2)}–${c.odds.ht15[1].toFixed(2)} for first-half over 1.5` : `${c.minOdds}–${c.maxOdds}`}, edge at least ${pct(c.minEdgePin, 0)} against Pinnacle or ${pct(c.minEdgeCons, 0)} against the consensus, priced by ${c.minBooks}+ bookmakers, and the chance not moving against it by ${(c.maxAgainst * 100).toFixed(0)}+ points.</p>
  <p><b>Key players.</b> When a pick is logged, the injury and suspension list is checked for the team's top three league scorers (3+ goals): the backed team for a win pick, both teams for goals picks. If one is out, the pick carries a warning (it is not dropped). About an hour before kick-off, when the official line-ups come out, the pick is checked again: a missing key scorer, or three or more regular starters (started 4 of the last 5 matches) not in the line-up, gives a ⚠️ reply to the slip message in Telegram; otherwise a ✅ line-ups OK reply. Both warnings are judged on the Past picks tab.</p>
  <p><b>Beyond the teams: motivation.</b> In the last 10 games of a season the table is read for each side: in the title/promotion race, fighting relegation, nothing left to play for, or mid-table (approximate: split seasons and play-offs are not modelled). We tested this on 35,000 matches with Pinnacle's closing prices (30 leagues, 2022–25). Two situations stood out: an away side still playing for something against a home side with nothing left (won 38.1% vs 33.1% priced; ahead in all four seasons), and two sides with nothing to play for (over 2.5 hit 61.5% vs 57.1% priced; ahead in three of four). These add a little to the market's chance (3 and 2 points). Two other situations block a pick: backing a home side with nothing left against a motivated visitor, and over 2.5 when both sides are under pressure. The rules were fixed before going live and are judged separately on the Past picks tab.</p>
  <p><b>How to judge it.</b> Wins and losses over a few weeks are mostly luck. The fast honest test is whether the price we took beats the later price (odds taken × later chance − 1 above zero) over 100+ picks. If it doesn't, no amount of winning streaks makes it real.</p>
  <p class="note">Paper betting only; no real bets are placed. Odds from Sportmonks; results are 90-minute scores.</p>`;
