name: History odds (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download football-data.co.uk results and odds (2022–24)
        run: node scripts/hist.js
      - name: Save
        run: |
          git config user.name "magic-numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hist
          git diff --cached --quiet || git commit -m "Historical odds from football-data.co.uk"
          git pull --rebase
          git push
