name: Backup source (football-data.co.uk)

on:
  schedule:
    - cron: '47 6 * * *'   # 08:47 Cyprus time (winter)
    - cron: '47 16 * * *'  # 18:47 Cyprus time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download results and upcoming fixtures with odds (no API key)
        run: node scripts/fdco.js
      - name: Pinnacle and Betfair Exchange prices (The Odds API, free plan)
        env:
          ODDSAPI_KEY: ${{ secrets.ODDSAPI_KEY }}
        run: node scripts/pinnacle.js || echo "pinnacle.js failed — site builds without Pinnacle prices"
      - name: Build the backup site
        run: |
          # One-time move: keep the API-Football site's last data under docs/api/ before the main site switches.
          if [ ! -d docs/api/data ]; then mkdir -p docs/api && cp -r docs/data docs/api/data; fi
          SOURCE=fd node scripts/build.js
          cp docs/index.html docs/engine.js docs/api/
      - name: Save
        run: |
          git config user.name "magic-numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fdco docs
          if [ -f data/sharp.json ]; then git add data/sharp.json; fi
          git diff --cached --quiet || git commit -m "Backup source update $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
