name: Daily collect & predict

on:
  schedule:
    - cron: '23 4 * * *'   # 06:23 Cyprus time (winter)
    - cron: '23 15 * * *'  # 17:23 Cyprus time — second run so one failure is harmless
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect fixtures (yesterday, today, tomorrow)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node scripts/collect.js
      - name: Build predictions and stats
        run: node scripts/build.js
      - name: Save
        run: |
          git config user.name "magic-numbers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
